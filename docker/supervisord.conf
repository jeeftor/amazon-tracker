[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisor/supervisord.pid
childlogdir=/tmp/supervisor
umask=0077

[program:xserver]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:windowmanager]
command=/usr/bin/fluxbox -rc /etc/fluxbox/tracker-init
priority=20
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:vnc]
command=/usr/bin/x11vnc -display :99 -localhost -rfbport 5900 -forever -shared -nopw -quiet
priority=30
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:app]
command=/opt/tracker-venv/bin/python -m amazon_tracker
directory=/app
priority=50
autorestart=true
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
